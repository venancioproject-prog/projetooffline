<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="roseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF99C2"/>
      <stop offset="50%" stop-color="#FF4D88"/>
      <stop offset="100%" stop-color="#D9045B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#D9045B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fundo Circular Delicado -->
  <circle cx="32" cy="32" r="30" fill="#FFF0F5" stroke="#FFB6C1" stroke-width="2"/>

  <!-- Folhas Verdes de Fundo -->
  <path d="M22 46 C16 48 10 40 14 34 C20 34 22 40 22 46 Z" fill="#68A357" opacity="0.9"/>
  <path d="M42 46 C48 48 54 40 50 34 C44 34 42 40 42 46 Z" fill="#78B966" opacity="0.9"/>

  <!-- Pétalas Externas da Rosa -->
  <g filter="url(#glow)">
    <path d="M32 14 C24 14 16 22 18 30 C16 38 24 46 32 46 C40 46 48 38 46 30 C48 22 40 14 32 14 Z" fill="url(#roseGradient)"/>
    
    <!-- Camadas de Pétalas Internas e Curvas Delicadas -->
    <path d="M32 18 C26 18 21 24 23 31 C25 38 31 42 32 42 C33 42 39 38 41 31 C43 24 38 18 32 18 Z" fill="#FF4D88" opacity="0.95"/>
    <path d="M32 22 C28 22 24 26 26 31 C28 36 32 38 32 38 C32 38 36 36 38 31 C40 26 36 22 32 22 Z" fill="#FF70A6"/>
    <path d="M32 25 C29 25 27 28 28 31 C29 34 32 35 32 35 C32 35 35 34 36 31 C37 28 35 25 32 25 Z" fill="#FFADC9"/>
    
    <!-- Miolo Espiral da Rosa -->
    <path d="M31 29 C31 28 33 28 33 29 C33 31 31 31 31 32 C31 32.5 32 33 32.5 33" fill="none" stroke="#D9045B" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Brilho / Sparkle ✨ -->
  <path d="M48 16 Q49 19 52 20 Q49 21 48 24 Q47 21 44 20 Q47 19 48 16 Z" fill="#FFD700"/>
</svg>
